<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Sierra Leone Football Agency</title>
    <link rel="stylesheet" href="./CSS/Style.css">
</head>

<body>

    <header class="site-header">
        <img src="logo.jpeg" class="logo" alt="Agency Logo">
        <h1>Contact Us</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="players.html">Players</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="matches.html">Matches</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="container">

        <div class="contact-info">
            <form action="#" method="post">
                <label for="name">Name</label><br>
                <input id="name" name="name" type="text" style="width:100%; padding:10px;"><br><br>

                <label for="email">Email</label><br>
                <input id="email" name="email" type="email" style="width:100%; padding:10px;"><br><br>

                <label for="message">Message</label><br>
                <textarea id="message" name="message" style="width:100%; height:150px; padding:10px;"></textarea><br><br>

                <button type="submit" style="padding:10px 20px;">Send</button>
            </form>
        </div>

        <h2>Social Links</h2>
        <div class="social-links">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook (opens in a new tab)">Facebook</a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram (opens in a new tab)">Instagram</a>
            <a href="https://x.com" target="_blank" rel="noopener noreferrer" aria-label="Twitter (opens in a new tab)">Twitter</a>
            <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" aria-label="YouTube (opens in a new tab)">YouTube</a>
        </div>

    </div>

    <footer>
        © 2025 Sierra Leone Football Agency
    </footer>

</body>

</html>
